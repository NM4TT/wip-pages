<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Coming Soon</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="placeholder-page">
    <div class="illustration-frame" aria-hidden="true">
      <svg
        id="wireframe-svg"
        viewBox="0 0 400 300"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        preserveAspectRatio="xMidYMid meet"
      >
        <!-- Offset Solid Backing Shadow -->
        <rect
          x="58"
          y="40"
          width="296"
          height="224"
          rx="8"
          fill="#dfddd4"
          stroke="#1a1917"
          stroke-width="1.5"
        />

        <!-- Main Browser Window Frame -->
        <rect
          x="52"
          y="34"
          width="296"
          height="224"
          rx="8"
          fill="#f6f5f0"
          stroke="#1a1917"
          stroke-width="1.75"
        />

        <!-- Browser Top Bar -->
        <path
          d="M52 42 C52 37.5817 55.5817 34 60 34 H340 C344.418 34 348 37.5817 348 42 V62 H52 V42 Z"
          fill="#ebe9e2"
          stroke="#1a1917"
          stroke-width="1.75"
        />
        <!-- Window Control Dots -->
        <circle cx="68" cy="48" r="3.2" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.3" />
        <circle cx="80" cy="48" r="3.2" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.3" />
        <circle cx="92" cy="48" r="3.2" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.3" />
        <!-- Address Bar -->
        <rect
          x="108"
          y="42"
          width="184"
          height="12"
          rx="3"
          fill="#f6f5f0"
          stroke="#1a1917"
          stroke-width="1.2"
        />

        <!-- Subtle Layout Column Guides Inside Viewport -->
        <g stroke="#e6e4dc" stroke-width="1" stroke-dasharray="3 3">
          <line x1="72" y1="63" x2="72" y2="257" />
          <line x1="328" y1="63" x2="328" y2="257" />
          <line x1="53" y1="96" x2="347" y2="96" />
          <line x1="53" y1="184" x2="347" y2="184" />
        </g>

        <!-- STEP 1: Website Navigation Bar -->
        <g id="wf-nav">
          <rect x="72" y="74" width="40" height="12" rx="2" fill="#1a1917" />
          <line x1="244" y1="80" x2="264" y2="80" stroke="#1a1917" stroke-width="2" stroke-linecap="round" />
          <line x1="274" y1="80" x2="294" y2="80" stroke="#1a1917" stroke-width="2" stroke-linecap="round" />
          <line x1="304" y1="80" x2="328" y2="80" stroke="#1a1917" stroke-width="2" stroke-linecap="round" />
        </g>

        <!-- STEP 2A: Hero Copy Block (Left) -->
        <g id="wf-hero-copy">
          <rect x="72" y="108" width="98" height="9" rx="2" fill="#1a1917" />
          <rect x="72" y="122" width="74" height="9" rx="2" fill="#1a1917" />
          <rect x="72" y="139" width="106" height="4.5" rx="1.5" fill="#8c8980" />
          <rect x="72" y="148" width="86" height="4.5" rx="1.5" fill="#8c8980" />
          <rect
            x="72"
            y="161"
            width="50"
            height="14"
            rx="2.5"
            fill="#ebe9e2"
            stroke="#1a1917"
            stroke-width="1.4"
          />
        </g>

        <!-- STEP 2B: Hero Image Wireframe Box (Right) -->
        <g id="wf-hero-media">
          <rect
            x="196"
            y="105"
            width="132"
            height="70"
            rx="4"
            fill="#ebe9e2"
            stroke="#1a1917"
            stroke-width="1.5"
          />
          <circle cx="220" cy="125" r="6.5" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.3" />
          <path
            d="M204 165 L238 135 L266 158 L288 141 L320 165 Z"
            fill="#dfddd4"
            stroke="#1a1917"
            stroke-width="1.3"
            stroke-linejoin="round"
          />
        </g>

        <!-- STEP 3: Three Feature Cards -->
        <g id="wf-card-1" class="wf-card">
          <rect
            x="72"
            y="194"
            width="78"
            height="50"
            rx="4"
            fill="#ebe9e2"
            stroke="#1a1917"
            stroke-width="1.5"
          />
          <rect x="80" y="203" width="26" height="6" rx="1.5" fill="#1a1917" />
          <line x1="80" y1="217" x2="138" y2="217" stroke="#78766f" stroke-width="2" stroke-linecap="round" />
          <line x1="80" y1="225" x2="122" y2="225" stroke="#78766f" stroke-width="2" stroke-linecap="round" />
        </g>

        <g id="wf-card-2" class="wf-card">
          <rect
            x="161"
            y="194"
            width="78"
            height="50"
            rx="4"
            fill="#ebe9e2"
            stroke="#1a1917"
            stroke-width="1.5"
          />
          <rect x="169" y="203" width="26" height="6" rx="1.5" fill="#1a1917" />
          <line x1="169" y1="217" x2="227" y2="217" stroke="#78766f" stroke-width="2" stroke-linecap="round" />
          <line x1="169" y1="225" x2="211" y2="225" stroke="#78766f" stroke-width="2" stroke-linecap="round" />
        </g>

        <g id="wf-card-3" class="wf-card">
          <rect
            x="250"
            y="194"
            width="78"
            height="50"
            rx="4"
            fill="#ebe9e2"
            stroke="#1a1917"
            stroke-width="1.5"
          />
          <rect x="258" y="203" width="26" height="6" rx="1.5" fill="#1a1917" />
          <line x1="258" y1="217" x2="316" y2="217" stroke="#78766f" stroke-width="2" stroke-linecap="round" />
          <line x1="258" y1="225" x2="300" y2="225" stroke="#78766f" stroke-width="2" stroke-linecap="round" />
        </g>

        <!-- Drafting Cursor / Pointer Placing Elements -->
        <g id="wf-cursor" transform="translate(90, 82)">
          <path
            d="M0 0 L0 17 L4.8 13.2 L8.5 20 L11.2 18.6 L7.5 11.8 L13 11.8 Z"
            fill="#1a1917"
            stroke="#f6f5f0"
            stroke-width="1.2"
            stroke-linejoin="round"
          />
        </g>
      </svg>
    </div>

    <div class="copy-block">
      <h1 class="title">Coming soon.</h1>
      <p class="subtitle">A new website is currently in the works.</p>
    </div>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
