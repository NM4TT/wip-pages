<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ready for Launch</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!--
    Configure launch date at build/deploy time via:
    1. VITE_LAUNCH_DATE in .env (or `pnpm build:page split-flap YYYY-MM-DDTHH:mm:ss`)
    2. data-target="YYYY-MM-DDTHH:mm:ss" attribute on <main> below
  -->
  <main class="placeholder-page" data-target="">
    <div class="illustration-frame" aria-hidden="true">
      <svg
        id="split-flap-svg"
        viewBox="0 0 460 250"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        preserveAspectRatio="xMidYMid meet"
      >
        <defs>
          <!-- DAYS Clips -->
          <clipPath id="clip-days-top"><rect x="44" y="62" width="80" height="49" rx="5" /></clipPath>
          <clipPath id="clip-days-bot"><rect x="44" y="111" width="80" height="49" rx="5" /></clipPath>

          <!-- HOURS Clips -->
          <clipPath id="clip-hours-top"><rect x="140" y="62" width="80" height="49" rx="5" /></clipPath>
          <clipPath id="clip-hours-bot"><rect x="140" y="111" width="80" height="49" rx="5" /></clipPath>

          <!-- MINS Clips -->
          <clipPath id="clip-mins-top"><rect x="236" y="62" width="80" height="49" rx="5" /></clipPath>
          <clipPath id="clip-mins-bot"><rect x="236" y="111" width="80" height="49" rx="5" /></clipPath>

          <!-- SECS Clips -->
          <clipPath id="clip-secs-top"><rect x="332" y="62" width="80" height="49" rx="5" /></clipPath>
          <clipPath id="clip-secs-bot"><rect x="332" y="111" width="80" height="49" rx="5" /></clipPath>
        </defs>

        <!-- Offset Solid Backing Shadow -->
        <rect
          x="24"
          y="42"
          width="420"
          height="172"
          rx="12"
          fill="#dfddd4"
          stroke="#1a1917"
          stroke-width="1.5"
        />

        <!-- Main Mechanical Display Casing -->
        <rect
          x="18"
          y="36"
          width="420"
          height="172"
          rx="12"
          fill="#ebe9e2"
          stroke="#1a1917"
          stroke-width="1.75"
        />

        <!-- Corner Fasteners -->
        <circle cx="34" cy="52" r="3" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.2" />
        <circle cx="422" cy="52" r="3" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.2" />
        <circle cx="34" cy="192" r="3" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.2" />
        <circle cx="422" cy="192" r="3" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.2" />

        <!-- Separator Colons -->
        <g fill="#78766f">
          <circle cx="132" cy="102" r="2" />
          <circle cx="132" cy="120" r="2" />
          <circle cx="228" cy="102" r="2" />
          <circle cx="228" cy="120" r="2" />
          <circle cx="324" cy="102" r="2" />
          <circle cx="324" cy="120" r="2" />
        </g>

        <!-- ==================== MODULE 1: DAYS (x=44, cx=84) ==================== -->
        <g id="mod-days">
          <rect x="44" y="62" width="80" height="98" rx="5" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.6" />
          <g clip-path="url(#clip-days-top)">
            <rect x="44" y="62" width="80" height="49" fill="#f6f5f0" />
            <text id="days-base-top" class="flap-digit" x="84" y="129" text-anchor="middle">03</text>
          </g>
          <g clip-path="url(#clip-days-bot)">
            <rect x="44" y="111" width="80" height="49" fill="#f6f5f0" />
            <text id="days-base-bot" class="flap-digit" x="84" y="129" text-anchor="middle">03</text>
          </g>
          <g id="days-flap-upper">
            <g clip-path="url(#clip-days-top)">
              <rect x="45" y="63" width="78" height="48" rx="4" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.2" />
              <text id="days-upper-text" class="flap-digit" x="84" y="129" text-anchor="middle">03</text>
            </g>
          </g>
          <g id="days-flap-lower">
            <g clip-path="url(#clip-days-bot)">
              <rect x="45" y="111" width="78" height="48" rx="4" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.2" />
              <text id="days-lower-text" class="flap-digit" x="84" y="129" text-anchor="middle">03</text>
            </g>
          </g>
          <rect x="44" y="62" width="80" height="98" rx="5" fill="none" stroke="#1a1917" stroke-width="1.6" />
          <line x1="44" y1="111" x2="124" y2="111" stroke="#f6f5f0" stroke-width="3" />
          <line x1="44" y1="111" x2="124" y2="111" stroke="#1a1917" stroke-width="1.4" />
          <rect x="41.5" y="107" width="4" height="8" rx="1" fill="#ebe9e2" stroke="#1a1917" stroke-width="1.2" />
          <rect x="122.5" y="107" width="4" height="8" rx="1" fill="#ebe9e2" stroke="#1a1917" stroke-width="1.2" />
          <text class="flap-label" x="84" y="182" text-anchor="middle">DAYS</text>
        </g>

        <!-- ==================== MODULE 2: HOURS (x=140, cx=180) ==================== -->
        <g id="mod-hours">
          <rect x="140" y="62" width="80" height="98" rx="5" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.6" />
          <g clip-path="url(#clip-hours-top)">
            <rect x="140" y="62" width="80" height="49" fill="#f6f5f0" />
            <text id="hours-base-top" class="flap-digit" x="180" y="129" text-anchor="middle">14</text>
          </g>
          <g clip-path="url(#clip-hours-bot)">
            <rect x="140" y="111" width="80" height="49" fill="#f6f5f0" />
            <text id="hours-base-bot" class="flap-digit" x="180" y="129" text-anchor="middle">14</text>
          </g>
          <g id="hours-flap-upper">
            <g clip-path="url(#clip-hours-top)">
              <rect x="141" y="63" width="78" height="48" rx="4" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.2" />
              <text id="hours-upper-text" class="flap-digit" x="180" y="129" text-anchor="middle">14</text>
            </g>
          </g>
          <g id="hours-flap-lower">
            <g clip-path="url(#clip-hours-bot)">
              <rect x="141" y="111" width="78" height="48" rx="4" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.2" />
              <text id="hours-lower-text" class="flap-digit" x="180" y="129" text-anchor="middle">14</text>
            </g>
          </g>
          <rect x="140" y="62" width="80" height="98" rx="5" fill="none" stroke="#1a1917" stroke-width="1.6" />
          <line x1="140" y1="111" x2="220" y2="111" stroke="#f6f5f0" stroke-width="3" />
          <line x1="140" y1="111" x2="220" y2="111" stroke="#1a1917" stroke-width="1.4" />
          <rect x="137.5" y="107" width="4" height="8" rx="1" fill="#ebe9e2" stroke="#1a1917" stroke-width="1.2" />
          <rect x="218.5" y="107" width="4" height="8" rx="1" fill="#ebe9e2" stroke="#1a1917" stroke-width="1.2" />
          <text class="flap-label" x="180" y="182" text-anchor="middle">HRS</text>
        </g>

        <!-- ==================== MODULE 3: MINS (x=236, cx=276) ==================== -->
        <g id="mod-mins">
          <rect x="236" y="62" width="80" height="98" rx="5" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.6" />
          <g clip-path="url(#clip-mins-top)">
            <rect x="236" y="62" width="80" height="49" fill="#f6f5f0" />
            <text id="mins-base-top" class="flap-digit" x="276" y="129" text-anchor="middle">29</text>
          </g>
          <g clip-path="url(#clip-mins-bot)">
            <rect x="236" y="111" width="80" height="49" fill="#f6f5f0" />
            <text id="mins-base-bot" class="flap-digit" x="276" y="129" text-anchor="middle">29</text>
          </g>
          <g id="mins-flap-upper">
            <g clip-path="url(#clip-mins-top)">
              <rect x="237" y="63" width="78" height="48" rx="4" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.2" />
              <text id="mins-upper-text" class="flap-digit" x="276" y="129" text-anchor="middle">29</text>
            </g>
          </g>
          <g id="mins-flap-lower">
            <g clip-path="url(#clip-mins-bot)">
              <rect x="237" y="111" width="78" height="48" rx="4" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.2" />
              <text id="mins-lower-text" class="flap-digit" x="276" y="129" text-anchor="middle">29</text>
            </g>
          </g>
          <rect x="236" y="62" width="80" height="98" rx="5" fill="none" stroke="#1a1917" stroke-width="1.6" />
          <line x1="236" y1="111" x2="316" y2="111" stroke="#f6f5f0" stroke-width="3" />
          <line x1="236" y1="111" x2="316" y2="111" stroke="#1a1917" stroke-width="1.4" />
          <rect x="233.5" y="107" width="4" height="8" rx="1" fill="#ebe9e2" stroke="#1a1917" stroke-width="1.2" />
          <rect x="314.5" y="107" width="4" height="8" rx="1" fill="#ebe9e2" stroke="#1a1917" stroke-width="1.2" />
          <text class="flap-label" x="276" y="182" text-anchor="middle">MIN</text>
        </g>

        <!-- ==================== MODULE 4: SECS (x=332, cx=372) ==================== -->
        <g id="mod-secs">
          <rect x="332" y="62" width="80" height="98" rx="5" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.6" />
          <g clip-path="url(#clip-secs-top)">
            <rect x="332" y="62" width="80" height="49" fill="#f6f5f0" />
            <text id="secs-base-top" class="flap-digit" x="372" y="129" text-anchor="middle">59</text>
          </g>
          <g clip-path="url(#clip-secs-bot)">
            <rect x="332" y="111" width="80" height="49" fill="#f6f5f0" />
            <text id="secs-base-bot" class="flap-digit" x="372" y="129" text-anchor="middle">59</text>
          </g>
          <g id="secs-flap-upper">
            <g clip-path="url(#clip-secs-top)">
              <rect x="333" y="63" width="78" height="48" rx="4" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.2" />
              <text id="secs-upper-text" class="flap-digit" x="372" y="129" text-anchor="middle">59</text>
            </g>
          </g>
          <g id="secs-flap-lower">
            <g clip-path="url(#clip-secs-bot)">
              <rect x="333" y="111" width="78" height="48" rx="4" fill="#f6f5f0" stroke="#1a1917" stroke-width="1.2" />
              <text id="secs-lower-text" class="flap-digit" x="372" y="129" text-anchor="middle">59</text>
            </g>
          </g>
          <rect x="332" y="62" width="80" height="98" rx="5" fill="none" stroke="#1a1917" stroke-width="1.6" />
          <line x1="332" y1="111" x2="412" y2="111" stroke="#f6f5f0" stroke-width="3" />
          <line x1="332" y1="111" x2="412" y2="111" stroke="#1a1917" stroke-width="1.4" />
          <rect x="329.5" y="107" width="4" height="8" rx="1" fill="#ebe9e2" stroke="#1a1917" stroke-width="1.2" />
          <rect x="410.5" y="107" width="4" height="8" rx="1" fill="#ebe9e2" stroke="#1a1917" stroke-width="1.2" />
          <text class="flap-label" x="372" y="182" text-anchor="middle">SEC</text>
        </g>
      </svg>
    </div>

    <div class="copy-block">
      <h1 class="title">Ready for launch.</h1>
      <p class="subtitle">This site is prepared and going live shortly.</p>
    </div>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
